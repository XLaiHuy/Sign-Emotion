map_hash_bucket_size 256;
map_hash_max_size 4096;
map $arg_moonshine $signemo_trial_coep { default "require-corp"; "0" ""; }

# Generated after read-only model mounts are present, by the image entrypoint.
include /tmp/signemo-immutable-assets.map;
map $status $signemo_immutable_cache_control {
    default "no-store";
    200 "public, max-age=31536000, immutable";
    206 "public, max-age=31536000, immutable";
    304 "public, max-age=31536000, immutable";
}

# The Moonshine WASM bindings use embind's dynamic function construction.
# Permit it only in the dedicated optional research worker; keep the app and
# all other workers strict.
map "$uri|$arg_moonshine" $signemo_csp {
    default "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";
    ~^/assets/speech-moonshine\.worker-[^/]+\.js\|$ "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";
    ~^/runtime/moonshine/(single/|two/)?moonshine\.mjs\|$ "default-src 'none'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'";
    # JSEP's embind bridge constructs JS functions. Research probe only;
    # ordinary app, capture and model workers retain the default strict policy.
    ~^/assets/(tone-benchmark|tone-live|face-benchmark|face-gpu)\.worker-[^/]+\.js\|$ "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/signemo-security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Embedder-Policy $signemo_trial_coep always;
        include /etc/nginx/snippets/signemo-security-headers.conf;
    }

    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/signemo-security-headers.conf;
    }

    # Dedicated worker scripts must carry COEP too when the local research
    # page opts into cross-origin isolation for SharedArrayBuffer/WASM.
    location /assets/ {
        try_files $uri =404;
        # Vite filenames contain content hashes. Stable model/runtime URLs below
        # must revalidate instead of pinning old bytes for a year.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        include /etc/nginx/snippets/signemo-security-headers.conf;
    }

    location /models/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/snippets/signemo-security-headers.conf;
    }

    # Only a matching path+digest pair can receive immutable cache headers.
    # Unknown/old hashes return 404 instead of serving new bytes at an old URL.
    location /immutable/ {
        if ($signemo_immutable_asset = 0) { return 404; }
        rewrite "^/immutable/[a-f0-9]{64}(/.+)$" $1 break;
        try_files $uri =404;
        types { application/javascript mjs js; application/wasm wasm; application/json json; }
        add_header Cache-Control $signemo_immutable_cache_control always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        include /etc/nginx/snippets/signemo-security-headers.conf;
    }

    location /runtime/ {
        try_files $uri =404;
        types { application/javascript mjs js; application/wasm wasm; }
        add_header Cache-Control "public, max-age=3600" always;
        # Runtime ES modules loaded inside isolated workers need the same
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        # embedding policy as the worker entry point.
        include /etc/nginx/snippets/signemo-security-headers.conf;
    }

    # Optional local R&D bind mount; normal production contains no research assets.
    location /research/ {
        try_files $uri =404;
        types { application/javascript mjs; application/wasm wasm; application/json json; }
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/signemo-security-headers.conf;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
